[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-core"
version = "1.0.1"
description = "Enterprise-grade multi-SKU time-series forecasting engine"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Angel Zeledon", email = "angel.zeledon.fernandez@gmail.com"}
]
keywords = ["forecasting", "time-series", "machine-learning", "demand-planning", "lightgbm", "prophet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "lightgbm>=3.3",
    "xgboost>=1.7",
    "prophet>=1.1",
    "statsmodels>=0.13",
    "scipy>=1.9",
    "holidays>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "python-multipart"]
dl  = ["tensorflow>=2.11"]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/Angel-Zeledon/faro-lib"
Repository = "https://github.com/Angel-Zeledon/faro-lib"

[tool.setuptools.packages.find]
include = ["forecasting_core", "forecasting_core.*"]
