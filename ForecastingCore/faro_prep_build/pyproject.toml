[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-prep"
version = "0.1.1"
description = "Data preprocessing and feature engineering for time-series forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Angel Zeledon", email = "angel.zeledon.fernandez@gmail.com"}
]
keywords = ["preprocessing", "feature-engineering", "time-series", "pandas", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "holidays>=0.20",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/Angel-Zeledon/faro-lib"
Repository = "https://github.com/Angel-Zeledon/faro-lib"

[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["forecastlib", "forecastlib.*"]
