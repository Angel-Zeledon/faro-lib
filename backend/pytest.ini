[pytest]
pythonpath = ..
testpaths = tests
addopts = --import-mode=importlib
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    integration: marks tests that require DB connectivity
    stress: marks stress/concurrency tests
    offline: marks tests that run without DB (all service/DB calls mocked)
